<script>
(()=>{
const root=document.getElementById('mars-copy-balance');
const options=['Practical guidance','Editorial balance'];
const work=[['ai','AI & simulation','Model training, large simulations','Power + heat rejection'],['robot','Robotics & imaging','Mapping, sensor and image analysis','Processing + data ingestion'],['archive','Science archives','Retain experiments and datasets','Storage + redundancy']];
const controllers=[];let texture=null,textureFailed=false;
const image=new Image();image.crossOrigin='anonymous';image.onload=()=>{const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');x.drawImage(image,0,0,1024,512);try{texture=x.getImageData(0,0,1024,512).data;controllers.forEach(c=>c.draw())}catch(e){textureFailed=true;controllers.forEach(c=>c.draw())}};image.onerror=()=>{textureFailed=true;controllers.forEach(c=>c.draw())};image.src='https://cdn.jsdelivr.net/gh/Sanghel/solar-system-3d@develop/public/textures/mars.jpg';
const initial=window.openai?.widgetState?.privateContent?.balanced;
root.querySelectorAll('.opening').forEach((app,variantIndex)=>{const index=1;const editorial=variantIndex===1;
let s={stage:'landing',step:0,pop:50,work:['robot','archive'],flex:'flexible',lon:0.5,lat:.16,zoom:1,area:null,...(initial?.[variantIndex]||{})};
app.innerHTML=`<header><div class="brand">ARES<small>MARS DATA CENTER EXPLORER</small></div><div class="base-context"><strong>Ares base · Demo</strong></div></header><div class="space-stage"><div class="globe-wrap"><canvas aria-label="Rotatable Mars globe. Drag to rotate and tilt, or use the labeled direction buttons."></canvas><span class="loading-label">Loading Mars surface…</span></div><div class="intro"></div><div class="launch"></div><div class="globe-controls"><div class="keyboard-orbit"><button data-view="left" aria-label="Rotate globe west">←</button><button data-view="right" aria-label="Rotate globe east">→</button></div><div class="keyboard-orbit"><button data-view="up" aria-label="Tilt globe north">↑</button><button data-view="down" aria-label="Tilt globe south">↓</button></div><button data-view="zoom" aria-label="Zoom globe in">+</button><button data-view="out" aria-label="Zoom globe out">−</button></div><div class="canvas-hint">Drag to explore</div><div class="panel" hidden></div></div><details class="texture-note"><summary>Credits</summary><p>Mars texture: <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Resampled for globe rendering.</p></details>`;
const q=sel=>app.querySelector(sel),canvas=q('canvas'),cx=canvas.getContext('2d');let frame=0;
function persist(){const states=controllers.map(c=>c.state());window.openai?.setWidgetState?.({modelContent:{options:states.map((v,i)=>({option:options[i],stage:v.stage,population:v.pop,workloads:v.work,scheduling:v.flex,selectedArea:v.area}))},privateContent:{balanced:states}})?.catch(()=>{});}
function workloadHTML(){return `<fieldset><legend>Research workloads <span class="sub">· select any</span></legend><div class="workloads">${work.map(([id,title,desc,impact])=>`<label class="choice"><input type="checkbox" name="work" value="${id}" ${s.work.includes(id)?'checked':''}><span><strong>${title}</strong><small>${desc}</small></span></label>`).join('')}</div></fieldset>`;}
function populationHTML(){return `<fieldset><legend>Base population</legend><label class="population"><input aria-label="Base population" type="number" min="1" max="10000" step="1" value="${s.pop}" required><span class="sub">people</span></label><p class="field-help">Include your planned near-term crew size.</p></fieldset>`;}
function flexHTML(){return `<fieldset><legend>Can heavy jobs wait?</legend><div class="pills"><button type="button" data-flex="flexible" aria-pressed="${s.flex==='flexible'}">Yes, flexible</button><button type="button" data-flex="deadline" aria-pressed="${s.flex==='deadline'}">No, time-critical</button></div><p class="field-help">${editorial?'Let heavy research jobs follow available power, or plan for tighter deadlines.':'Flexible research jobs can run when power is available.'}</p></fieldset>`;}
function assumptions(){return `<details class="assumptions"><summary>Assumptions</summary><p>Base services included. Firm power plus supplemental solar assumed; capacity unverified. Facility sizing requires workload validation.</p></details>`;}
function bindForm(){q('input[type=number]')?.addEventListener('input',e=>{s.pop=Number(e.target.value);persist()});app.querySelectorAll('[name=work]').forEach(el=>el.onchange=()=>{s.work=[...app.querySelectorAll('[name=work]:checked')].map(x=>x.value);persist()});app.querySelectorAll('[data-flex]').forEach(el=>el.onclick=()=>{s.flex=el.dataset.flex;app.querySelectorAll('[data-flex]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.flex===s.flex));persist()});q('[data-close]')?.addEventListener('click',()=>{s.stage='landing';render();persist()});q('[data-back]')?.addEventListener('click',()=>{s.step=Math.max(0,s.step-1);render();persist()});q('[data-next]')?.addEventListener('click',()=>{if(!validate())return;s.step++;render();persist()});q('[data-find]')?.addEventListener('click',()=>{if(!validate())return;s.stage='results';render();persist()});}
function validate(){const input=q('input[type=number]');if(input&&!input.reportValidity())return false;if(!Number.isInteger(s.pop)||s.pop<1||s.pop>10000){s.step=0;render();q('input[type=number]')?.reportValidity();return false}return true;}
function render(){app.classList.toggle('active',s.stage!=='landing');app.classList.toggle('results',s.stage==='results');q('.intro').hidden=s.stage!=='landing';q('.launch').hidden=s.stage!=='landing';q('.panel').hidden=s.stage==='landing';
if(s.stage==='landing'){
const intros=[['A world of possibilities.','Find a place for the computing that powers your mission.'],['Your research.<br>Your next frontier.','Start with the people and work your facility will support. Explore promising areas near your base.'],['Every mission starts somewhere.','Explore Mars. Tell us what you need. Find where to look next.']];
q('.intro').innerHTML=`<h1>${intros[index][0]}</h1><p>${editorial?'Give your research room to grow. Start with your crew and workloads, then explore places to build near your base.':"Define your facility’s needs to explore candidate sites near your base."}</p>`;
q('.launch').innerHTML=`<button class="primary" data-start>Define data center →</button>`;
q('[data-start]').onclick=()=>{s.stage='intake';s.step=0;render();persist();q('input')?.focus({preventScroll:true})};
}else if(s.stage==='intake'){
if(index!==2){q('.panel').innerHTML=`<div class="panel-top"><h2>Data center</h2><button class="ghost" data-close aria-label="Close intake">Close</button></div><p class="panel-intro">${editorial?'Start with the people and research behind your mission. Base services are already included.':'Base services are included. Choose the research work this facility will support.'}</p>${populationHTML()}${workloadHTML()}${flexHTML()}${assumptions()}<div class="form-actions"><button class="primary" data-find>Find areas →</button></div>`;
}else{const titles=['How many people will it support?','What research will it power?','How flexible is the workload?'];q('.panel').innerHTML=`<div class="panel-top"><div class="stepper">${['People','Research','Scheduling'].map((n,i)=>`<span class="${i===s.step?'current':''}">${i+1} ${n}</span>`).join('')}</div><button class="ghost" data-close>Close</button></div><div class="step-body"><h2>${titles[s.step]}</h2>${s.step===0?populationHTML():s.step===1?workloadHTML():flexHTML()}${s.step===2?assumptions():''}<div class="form-actions">${s.step>0?'<button data-back>← Back</button>':''}<button class="primary" ${s.step===2?'data-find':'data-next'}>${s.step===2?'Find areas near my base':'Continue'} →</button></div></div>`;}bindForm();
}else{
const ai=s.work.includes('ai'),robot=s.work.includes('robot'),archive=s.work.includes('archive');const focus=s.flex==='deadline'?'Firm-power access and service continuity':ai?'Power availability and heat-rejection space':robot?'Data links and accessible service routes':archive?'Storage resilience and expansion space':'Base-integrated services and practical access';
const candidates=[['North terrace',ai?'Space for compute, solar and cooling.':'Connected space for expansion.','Verify ground strength and usable area.'],['Base-side apron',s.flex==='deadline'?'Shorter connection to base power.':'Smaller, base-integrated installation.','Confirm capacity, clearances and independence.'],['East bench',robot?'Access to field instruments and robots.':'Separate equipment plots and access routes.','Confirm route feasibility and terrain shadows.']];
q('.panel').innerHTML=`<div class="panel-top"><h2>Explore areas</h2><button class="ghost" data-edit>Edit</button></div><p class="sub">Near Ares base · Illustrative candidates</p><div class="result-profile">${focus}</div><p class="panel-intro">${editorial?'Each area offers a different starting point. Explore its promise and the questions still to answer.':'Compare the tradeoffs, then select an area to see what needs checking.'}</p><div class="result-list">${candidates.map(([name,why,unknown],i)=>`<button class="result-card" data-area="${i}" aria-pressed="${s.area===i}"><strong>${String.fromCharCode(65+i)} · ${name}</strong><small>${why}</small></button>`).join('')}</div><div class="candidate-detail" aria-live="polite" ${s.area===null?'hidden':''}>${s.area===null?'':candidates[s.area][2]}</div>`;
app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{s.stage='intake';s.step=index===2?2:0;render();persist()});app.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{s.area=+b.dataset.area;render();persist()});
}requestDraw();}
// Orthographic sphere rendering from the credited equirectangular surface texture.
// No site rankings or local terrain geometry are derived from this visual texture.
function draw(){frame=0;const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;const w=Math.round(rect.width),h=Math.round(rect.height);canvas.width=w;canvas.height=h;cx.clearRect(0,0,w,h);const grd=cx.createRadialGradient(w*.5,h*.45,20,w*.5,h*.45,Math.max(w,h)*.7);grd.addColorStop(0,'#111b23');grd.addColorStop(1,'#05080c');cx.fillStyle=grd;cx.fillRect(0,0,w,h);for(let i=0;i<150;i++){const x=((i*137.241)%997)/997*w,y=((i*97.173)%991)/991*h;cx.fillStyle=`rgba(210,224,232,${.12+(i%5)*.08})`;cx.fillRect(x,y,i%7===0?1.5:.7,i%7===0?1.5:.7)}
const mobile=w<550;const r=Math.min(w*.43,h*.43)*s.zoom,centerX=w*.5,centerY=h*(s.stage==='landing'&&index===0?.48:.48);const size=Math.min(660,Math.max(160,Math.ceil(r*2))),off=document.createElement('canvas');off.width=size;off.height=size;const oc=off.getContext('2d'),im=oc.createImageData(size,size),data=im.data;const sl=Math.sin(s.lat),cl=Math.cos(s.lat),so=Math.sin(s.lon),co=Math.cos(s.lon);
for(let j=0;j<size;j++)for(let i=0;i<size;i++){const x=(i+.5)/size*2-1,y=1-(j+.5)/size*2,d=x*x+y*y;if(d>1)continue;const z=Math.sqrt(1-d),yy=y*cl+z*sl,zz=z*cl-y*sl,xx=x*co+zz*so,zr=zz*co-x*so;const lon=Math.atan2(xx,zr),lat=Math.asin(Math.max(-1,Math.min(1,yy))),u=((lon/(2*Math.PI)+.5)%1+1)%1,v=.5-lat/Math.PI;const idx=(j*size+i)*4;const lighting=.24+.76*Math.max(0,-.45*x+.3*y+.84*z);if(texture){const ti=(Math.min(511,Math.floor(v*512))*1024+Math.min(1023,Math.floor(u*1024)))*4;data[idx]=texture[ti]*lighting;data[idx+1]=texture[ti+1]*lighting;data[idx+2]=texture[ti+2]*lighting}else{const n=Math.sin(lon*9+Math.sin(lat*8))*Math.cos(lat*12)+.3*Math.sin(lon*38+lat*49);data[idx]=(170+n*16)*lighting;data[idx+1]=(109+n*13)*lighting;data[idx+2]=(76+n*10)*lighting}data[idx+3]=255;}
oc.putImageData(im,0,0);cx.save();cx.shadowColor='#cb84515c';cx.shadowBlur=18;cx.beginPath();cx.arc(centerX,centerY,r,0,Math.PI*2);cx.fillStyle='#ad7448';cx.fill();cx.restore();cx.drawImage(off,centerX-r,centerY-r,r*2,r*2);cx.beginPath();cx.arc(centerX,centerY,r,0,Math.PI*2);cx.strokeStyle='#d99b6866';cx.lineWidth=1;cx.stroke();
const loading=q('.loading-label');loading.hidden=!!texture;loading.textContent=textureFailed?'Illustrative globe · surface texture unavailable':'Loading Mars surface…';
}
function requestDraw(){if(!frame)frame=requestAnimationFrame(draw)}
let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;s.lon-=(e.clientX-drag[0])*.008;s.lat=Math.max(-Math.PI/2,Math.min(Math.PI/2,s.lat+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];requestDraw()};canvas.onpointerup=e=>{drag=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);persist()};canvas.onpointercancel=()=>{drag=null};canvas.addEventListener('wheel',e=>{e.preventDefault();s.zoom=Math.max(.7,Math.min(1.4,s.zoom-e.deltaY*.001));requestDraw();persist()},{passive:false});app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const d=b.dataset.view;if(d==='left')s.lon-=.3;if(d==='right')s.lon+=.3;if(d==='up')s.lat=Math.min(Math.PI/2,s.lat+.2);if(d==='down')s.lat=Math.max(-Math.PI/2,s.lat-.2);if(d==='zoom')s.zoom=Math.min(1.4,s.zoom+.1);if(d==='out')s.zoom=Math.max(.7,s.zoom-.1);requestDraw();persist()});new ResizeObserver(requestDraw).observe(canvas);
controllers.push({state:()=>s,draw:requestDraw,restore:v=>{s={...s,...v};render()}});render();
if(globalThis.Tweak){const controls={size:37,tracking:-1};const tweak=new Tweak({container:app,onChange:()=>{const h=q('h1');if(h){h.style.fontSize=controls.size+'px';h.style.letterSpacing=controls.tracking+'px'}}});tweak.addSlider(controls,'size',{label:'Headline size',min:26,max:50,unit:'px'});tweak.addSlider(controls,'tracking',{label:'Letter spacing',min:-2,max:3,step:.25,unit:'px'})}
});
window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent?.balanced;if(Array.isArray(saved))saved.forEach((v,i)=>controllers[i]?.restore(v))});
})();
