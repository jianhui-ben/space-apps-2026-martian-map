<style>
#mars-guided-flow .ares{--space:#070b0f;--panel:#111920;--field:#0b1117;--ink:#f4f1e9;--muted:#aeb7bd;--line:#354048;--sand:#edc49b;--selected:#302a25;background:var(--space);color:var(--ink);font:14px/1.5 'Space Grotesk',sans-serif;min-height:1040px;position:relative;color-scheme:dark;border-radius:12px;overflow:hidden}
#mars-guided-flow .ares *{box-sizing:border-box}#mars-guided-flow [hidden]{display:none!important}
#mars-guided-flow .ares header{padding:25px 100px 24px 30px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}

#mars-guided-flow .brand-caption{color:var(--muted);font-size:11px;margin-top:3px}#mars-guided-flow .context{text-align:right;font-size:12px;color:var(--muted)}#mars-guided-flow .context strong{display:block;font-weight:500;color:var(--ink)}
#mars-guided-flow .journey{display:flex;gap:24px;padding:17px 30px;border-bottom:1px solid #ffffff14;color:var(--muted);font-size:12px;flex-wrap:wrap}#mars-guided-flow .journey .current{color:var(--sand)}#mars-guided-flow .journey span{display:flex;gap:8px;align-items:center}#mars-guided-flow .journey b{font-weight:400;opacity:.7}
#mars-guided-flow .workspace{padding:30px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(250px,.8fr);gap:34px}#mars-guided-flow .form-panel{min-width:0;background:var(--panel);padding:24px;border:1px solid var(--line);border-radius:10px}#mars-guided-flow .intro-line{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}#mars-guided-flow .sample-label{font-size:11px;color:var(--sand);padding:3px 8px;background:var(--selected);border-radius:4px}
#mars-guided-flow h1{font:400 24px/1.3 Audiowide,sans-serif;margin:0 0 8px}#mars-guided-flow h2{font-size:17px;font-weight:500;line-height:1.4;margin:0}#mars-guided-flow h3{font-size:14px;font-weight:500;margin:0 0 8px}#mars-guided-flow p{margin:0}#mars-guided-flow .help{color:var(--muted);font-size:12px;line-height:1.55;margin:6px 0 0}#mars-guided-flow .subhead{color:var(--muted);margin:0 0 22px;max-width:65ch}

#mars-guided-flow .ares button{padding:9px 12px;min-height:38px}#mars-guided-flow .ares button:hover{background:#26323c}#mars-guided-flow .ares button:focus-visible,#mars-guided-flow .ares input:focus-visible,#mars-guided-flow .ares select:focus-visible,#mars-guided-flow summary:focus-visible{outline:2px solid var(--sand);outline-offset:3px}
#mars-guided-flow .ares button.primary{background:var(--sand);color:#1d211f;border-color:var(--sand);font-weight:500}#mars-guided-flow .ares button.primary:hover{background:#f6d8b9}#mars-guided-flow .ares button.quiet{border-color:transparent;background:transparent;color:var(--muted)}#mars-guided-flow .ares button[aria-pressed=true]{background:var(--selected);border-color:var(--sand)}
#mars-guided-flow .ares input:not([type=checkbox]),#mars-guided-flow .ares select{width:100%;min-height:40px;padding:9px 10px}#mars-guided-flow .ares input[type=checkbox]{accent-color:var(--sand);width:16px;height:16px;margin:0;flex-shrink:0}#mars-guided-flow .ares input[type=number]{font-variant-numeric:tabular-nums}
#mars-guided-flow .steps{display:flex;gap:6px;margin:20px 0 24px}#mars-guided-flow .steps button{flex:1;padding:8px 5px;font-size:12px;background:transparent;border:0;border-radius:0;border-bottom:2px solid var(--line)}#mars-guided-flow .steps button[aria-current=step]{color:var(--sand);border-bottom-color:var(--sand)}
#mars-guided-flow .fields{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}#mars-guided-flow .full{grid-column:1/-1}#mars-guided-flow .field{display:flex;flex-direction:column;gap:7px;min-width:0}#mars-guided-flow label.field-label,#mars-guided-flow .field-label{font-weight:500;font-size:13px}#mars-guided-flow .choice-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}#mars-guided-flow .choice{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--field);font-size:13px}#mars-guided-flow .choice:has(:checked){border-color:#ab8d70;background:var(--selected)}
#mars-guided-flow .quantity-head{display:flex;align-items:center;justify-content:space-between;gap:8px}#mars-guided-flow .quantity-head select{font-size:11px;width:auto;padding:3px 6px;min-height:25px;max-width:105px}#mars-guided-flow .quantity-values{display:flex;align-items:center;gap:6px}#mars-guided-flow .unit{color:var(--muted);font-size:12px;white-space:nowrap}#mars-guided-flow .unknown-value{min-height:40px;display:flex;align-items:center;color:var(--muted);font-size:12px;border-bottom:1px dashed var(--line)}
#mars-guided-flow .actions{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}#mars-guided-flow .actions small{font-size:11px;color:var(--muted)}#mars-guided-flow .alert{color:#ffb19b;font-size:12px;margin-top:12px}
#mars-guided-flow .planet-side{position:relative;padding-top:20px;min-width:0}#mars-guided-flow canvas{width:100%;height:300px;display:block}#mars-guided-flow .side-title{font:400 23px/1.35 Audiowide,sans-serif;color:transparent;-webkit-text-stroke:.7px var(--sand);margin:10px 0 15px;max-width:300px}#mars-guided-flow .summary{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}#mars-guided-flow .summary dl,#mars-guided-flow .review-dl{margin:0}#mars-guided-flow .summary dl>div,#mars-guided-flow .review-dl>div{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #ffffff12}#mars-guided-flow dt{color:var(--muted)}#mars-guided-flow dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}#mars-guided-flow .summary .help{margin-top:16px}
#mars-guided-flow .fleet-head{display:grid;grid-template-columns:minmax(110px,1fr) 70px 76px 34px;gap:8px;color:var(--muted);font-size:11px;margin:12px 0 5px}#mars-guided-flow .robot-row{display:grid;grid-template-columns:minmax(110px,1fr) 70px 76px 34px;gap:8px;margin:9px 0;align-items:center}#mars-guided-flow .robot-row button{padding:6px;min-height:34px}#mars-guided-flow .robot-row select{font-size:12px}#mars-guided-flow .fleet-total{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-top:1px solid var(--line);margin-top:15px}#mars-guided-flow .fleet-total strong{font-size:20px;font-weight:500}
#mars-guided-flow .job{display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}#mars-guided-flow .job label{display:flex;align-items:center;gap:9px}#mars-guided-flow .job select{font-size:12px}#mars-guided-flow .ares details{border-top:1px solid var(--line);padding-top:15px;margin-top:20px}#mars-guided-flow .ares summary{font-size:13px;color:var(--muted);cursor:default}#mars-guided-flow details .fields{margin-top:15px}
#mars-guided-flow .factor-list{padding:0;margin:15px 0 0;list-style:none}#mars-guided-flow .factor-list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}#mars-guided-flow .factor-list span{font-size:12px;color:var(--muted)}#mars-guided-flow .credits{font-size:11px;color:var(--muted);padding:12px 30px 20px}#mars-guided-flow .credits a{color:inherit}
#mars-guided-flow .worksheet .workspace{display:block;padding-top:24px}#mars-guided-flow .sheet-heading{display:flex;justify-content:space-between;gap:22px;align-items:center;margin-bottom:22px}#mars-guided-flow .sheet-heading canvas{width:100px;height:100px}#mars-guided-flow .sheet-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(230px,.9fr);gap:24px}#mars-guided-flow .sheet-main{min-width:0}#mars-guided-flow .sheet-section{padding:20px 0;border-top:1px solid var(--line)}#mars-guided-flow .sheet-section:first-child{padding-top:0;border-top:0}#mars-guided-flow .sheet-section h2{margin-bottom:15px}#mars-guided-flow .worksheet .summary{margin-top:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;height:fit-content}#mars-guided-flow .worksheet .summary h2{margin-bottom:10px}#mars-guided-flow .worksheet .form-panel{padding:0;background:transparent;border:0}#mars-guided-flow .worksheet .sheet-heading h1{font-size:26px}#mars-guided-flow .worksheet .job{grid-template-columns:1fr 145px}
@media(max-width:780px){#mars-guided-flow .workspace{grid-template-columns:1fr;padding:20px;gap:20px}#mars-guided-flow .planet-side{display:none}#mars-guided-flow .sheet-grid{grid-template-columns:1fr}#mars-guided-flow .worksheet .summary{order:2}#mars-guided-flow .ares{min-height:1040px}#mars-guided-flow .ares header{padding-left:20px}#mars-guided-flow .journey{padding-left:20px;gap:14px}}
@media(max-width:460px){#mars-guided-flow .ares header{padding:20px 70px 20px 16px}#mars-guided-flow .context{display:none}#mars-guided-flow .workspace{padding:16px}#mars-guided-flow .form-panel{padding:16px}#mars-guided-flow .fields{grid-template-columns:1fr}#mars-guided-flow .choice-list{grid-template-columns:1fr 1fr}#mars-guided-flow .choice{font-size:12px;padding:9px 7px}#mars-guided-flow .robot-row,#mars-guided-flow .fleet-head{grid-template-columns:minmax(68px,1fr) 54px 54px 24px;gap:4px}#mars-guided-flow .robot-row select,#mars-guided-flow .robot-row input{padding:8px 4px;font-size:12px}#mars-guided-flow .job,#mars-guided-flow .worksheet .job{grid-template-columns:1fr}#mars-guided-flow .journey{font-size:11px;gap:11px}#mars-guided-flow h1{font-size:21px}#mars-guided-flow .sheet-heading canvas{display:none}#mars-guided-flow .steps{gap:0}#mars-guided-flow .steps button{font-size:11px}#mars-guided-flow .actions{flex-wrap:wrap}#mars-guided-flow .ares input:not([type=checkbox]),#mars-guided-flow .ares select{font-size:16px}#mars-guided-flow .quantity-head select{font-size:11px}}
#mars-guided-flow input[type=number]{appearance:textfield}#mars-guided-flow input[type=number]::-webkit-inner-spin-button,#mars-guided-flow input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

#mars-guided-flow .ares.landing{min-height:820px}
#mars-guided-flow .welcome{display:grid;grid-template-columns:minmax(250px,.85fr) minmax(0,1.35fr);align-items:center;gap:0;padding:60px 30px 50px;min-height:650px}
#mars-guided-flow .welcome-copy{position:relative;z-index:1;padding-left:6px}
#mars-guided-flow .welcome h1{font:400 38px/1.25 Audiowide,sans-serif;letter-spacing:-1px;text-transform:uppercase;color:transparent;-webkit-text-stroke:1px var(--sand);margin-bottom:24px;max-width:410px}
#mars-guided-flow .welcome p{max-width:310px;color:var(--muted);font-size:15px;line-height:1.65;margin-bottom:28px}
#mars-guided-flow .welcome .primary{font-size:14px;padding:13px 17px}
#mars-guided-flow .welcome small{display:block;color:var(--muted);font-size:12px;margin-top:13px;max-width:300px}
#mars-guided-flow .welcome-globe{position:relative;min-width:0}

#mars-guided-flow .orbit-controls span{color:var(--muted);font-size:12px;margin-right:10px}
#mars-guided-flow .home-link{font-size:12px;margin-bottom:4px}
#mars-guided-flow .landing .credits{border-top:1px solid #ffffff14}
@media(max-width:780px){#mars-guided-flow .welcome{padding:35px 24px;grid-template-columns:1fr;min-height:0}#mars-guided-flow .welcome h1{max-width:520px;font-size:32px}#mars-guided-flow .welcome p{max-width:460px}#mars-guided-flow .welcome canvas{height:390px}#mars-guided-flow .welcome-globe{margin-top:20px}#mars-guided-flow .ares.landing{min-height:0}#mars-guided-flow .context{display:block}}
@media(max-width:460px){#mars-guided-flow .welcome{padding:30px 20px}#mars-guided-flow .welcome h1{font-size:28px;letter-spacing:-.6px}#mars-guided-flow .welcome canvas{height:285px}#mars-guided-flow .context{font-size:11px}#mars-guided-flow .context strong{display:none}#mars-guided-flow .ares header{padding-right:70px;gap:10px}#mars-guided-flow .brand-caption{max-width:135px}#mars-guided-flow .orbit-controls{gap:4px}#mars-guided-flow .orbit-controls span{width:100%;text-align:center;margin-bottom:5px}}
</style>
<script>
(()=>{
const root=document.getElementById('mars-guided-flow');
const names=['Guided brief'];const roles=['Survey','Excavation','Transport','Assembly','Inspection'];
const types=['Landing pad','Road','Habitat','Power installation','Utility network','Other'];
const defaults=()=>({stage:'landing',started:false,orbit:{lon:.55,lat:0,zoom:1},step:0,review:false,name:'Gale landing pad & access road',other:'',types:['Landing pad','Road'],fleet:[{id:1,role:'Survey',count:4,active:4},{id:2,role:'Excavation',count:10,active:8},{id:3,role:'Transport',count:6,active:4}],nextId:4,phase:'Site preparation',quality:'Earthworks check',location:'Gale study region — site not selected',jobs:{map:true,progress:true,inspection:false,plan:true},cadence:{map:'Once per sol',progress:'Once per sol',inspection:'At phase end',plan:'Every 4 hours'},late:'Pause dependent work',power:'Unknown',continuity:'Unknown',deployment:'Compare both',q:{area:{mode:'unknown',value:20000,min:10000,max:30000},road:{mode:'unknown',value:1000,min:500,max:2000},hours:{mode:'known',value:12,min:8,max:12},deadline:{mode:'known',value:1,min:1,max:4},duration:{mode:'unknown',value:180,min:90,max:180},retention:{mode:'unknown',value:30,min:7,max:30}}});
const saved=window.openai?.widgetState?.privateContent?.guidedFlow;
const states=[0].map(i=>saved?.[i]?.q?{...defaults(),...saved[i]}:defaults());
const controllers=[];let texture=null;
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(arr,value)=>arr.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('');
function persist(){window.openai?.setWidgetState?.({modelContent:{intakeOptions:states.map((s,i)=>({design:names[i],stage:s.stage,project:s.name,types:s.types,robots:s.fleet,operatingHours:s.q.hours,turnaround:s.q.deadline}))},privateContent:{guidedFlow:states}})?.catch(()=>{});}
function draw(canvas){if(!canvas)return;const orbit=states[0].orbit;const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;canvas.width=w*1.5;canvas.height=h*1.5;const cx=canvas.getContext('2d');cx.scale(1.5,1.5);cx.clearRect(0,0,w,h);const r=Math.min(w,h)*.46*orbit.zoom,size=Math.ceil(r*2);const off=document.createElement('canvas');off.width=size;off.height=size;const oc=off.getContext('2d');const im=oc.createImageData(size,size);for(let y=0;y<size;y++)for(let x=0;x<size;x++){const nx=(x+.5)/size*2-1,ny=1-(y+.5)/size*2,d=nx*nx+ny*ny;if(d>1)continue;const z=Math.sqrt(1-d),yy=ny*Math.cos(orbit.lat)+z*Math.sin(orbit.lat),zz=z*Math.cos(orbit.lat)-ny*Math.sin(orbit.lat),lat=Math.asin(Math.max(-1,Math.min(1,yy))),lon=Math.atan2(nx,zz)+orbit.lon,u=((lon/(2*Math.PI)+.5)%1+1)%1,v=.5-lat/Math.PI;const shade=.12+.88*Math.max(0,-.5*nx+.25*ny+.8*z),i=(y*size+x)*4;let col=[170,108,76];if(texture){const k=(Math.min(511,Math.floor(v*512))*1024+Math.min(1023,Math.floor(u*1024)))*4;col=[texture[k],texture[k+1],texture[k+2]]}for(let j=0;j<3;j++)im.data[i+j]=col[j]*shade;im.data[i+3]=255}oc.putImageData(im,0,0);cx.drawImage(off,w/2-r,h/2-r,r*2,r*2);}
root.querySelectorAll('.ares').forEach((app,index)=>{
let s=states[index];const uid=`ci${index}`;const q=sel=>app.querySelector(sel);
function quantity(key,label,unit){const v=s.q[key];return `<div class="field"><div class="quantity-head"><label class="field-label" for="${uid}-${key}">${label}</label><select aria-label="${label} certainty" data-mode="${key}">${[['known','Known'],['range','Range'],['unknown','Unknown']].map(([k,n])=>`<option value="${k}" ${v.mode===k?'selected':''}>${n}</option>`).join('')}</select></div><div class="quantity-values">${v.mode==='unknown'?'<span class="unknown-value">To be confirmed</span>':v.mode==='range'?`<input id="${uid}-${key}" aria-label="${label} minimum" type="number" min="0.01" step="any" data-q="${key}" data-bound="min" value="${v.min}"><span class="unit">to</span><input aria-label="${label} maximum" type="number" min="0.01" step="any" data-q="${key}" data-bound="max" value="${v.max}"><span class="unit">${unit}</span>`:`<input id="${uid}-${key}" type="number" min="0.01" ${key==='hours'?'max="24.65"':''} step="any" data-q="${key}" data-bound="value" value="${v.value}" required><span class="unit">${unit}</span>`}</div></div>`;}
function select(key,label,choices){return `<label class="field"><span class="field-label">${label}</span><select data-key="${key}">${opts(choices,s[key])}</select></label>`}
function project(){return `<div class="fields"><label class="field full"><span class="field-label">Project name</span><input data-key="name" maxlength="120" value="${esc(s.name)}" required></label><div class="field full"><span class="field-label" id="${uid}-build-label">What are you building?</span><div class="choice-list" role="group" aria-labelledby="${uid}-build-label">${types.map(t=>`<label class="choice"><input type="checkbox" data-type="${t}" ${s.types.includes(t)?'checked':''}><span>${t}</span></label>`).join('')}</div></div>${s.types.includes('Other')?`<label class="field full"><span class="field-label">Other construction type</span><input data-key="other" value="${esc(s.other)}" required></label>`:''}${quantity('area','Survey area','m²')}${s.types.includes('Road')?quantity('road','Road length','m'):quantity('duration','Project duration','sols')}<label class="field full"><span class="field-label">Construction location</span><select data-key="location">${opts(['Gale study region — site not selected','Coordinates not yet known'],s.location)}</select><span class="help">Detailed map selection comes after the project brief.</span></label></div>`}
function fleet(){return `<p class="help">Group robots by their main task. Active units work at the same time.</p><div class="fleet-head" aria-hidden="true"><span>Main task</span><span>Total</span><span>Active</span><span></span></div><div class="robot-rows">${s.fleet.map(f=>`<div class="robot-row"><select data-robot="${f.id}" data-prop="role" aria-label="Robot ${f.id} main task">${opts(roles,f.role)}</select><input type="number" min="0" step="1" value="${f.count}" data-robot="${f.id}" data-prop="count" aria-label="${f.role} total robots" required><input type="number" min="0" max="${f.count}" step="1" value="${f.active}" data-robot="${f.id}" data-prop="active" aria-label="${f.role} active robots" required><button type="button" class="quiet" data-remove="${f.id}" aria-label="Remove ${f.role} group">×</button></div>`).join('')}</div><button type="button" data-add>+ Add robot group</button><div class="fleet-total"><span>Total fleet</span><span><strong data-total>${s.fleet.reduce((n,f)=>n+f.count,0)}</strong> robots</span></div><p class="help">Onboard driving and safety remain with each robot.</p>`}
function schedule(){return `<div class="fields"><label class="field full"><span class="field-label">Construction phase</span><input data-key="phase" value="${esc(s.phase)}" required></label>${quantity('hours','Operating time','h / sol')}${quantity('duration','Project duration','sols')}${select('quality','Construction precision',['Coarse survey','Earthworks check','Precision assembly','Unknown'])}${quantity('deadline','Results needed within','hours')}</div><p class="help">Turnaround starts when survey collection finishes. A sol is a Mars day.</p>`}
function jobs(){return `<div>${[['map','Terrain maps'],['progress','Progress comparisons'],['inspection','Inspection reports'],['plan','Fleet work plans']].map(([key,label])=>`<div class="job"><label><input type="checkbox" data-job="${key}" ${s.jobs[key]?'checked':''}>${label}</label><select aria-label="${label} frequency" data-cadence="${key}" ${s.jobs[key]?'':'disabled'}>${opts(['Once per sol','Every 4 hours','At phase end','Unknown'],s.cadence[key])}</select></div>`).join('')}</div>`}
function advanced(){return `<details><summary>Retention, infrastructure & continuity</summary><div class="fields">${quantity('retention','Keep raw survey data','sols')}${select('power','Available power',['Unknown','Base connection','Solar + storage','Hybrid'])}${select('continuity','Allowed service interruption',['Unknown','Up to 1 hour','Up to 4 hours','Work can pause'])}${select('deployment','Computing installation',['Compare both','Inside the base','Dedicated installation'])}</div><p class="help">Equipment and processing profiles are selected during sizing. Unknowns stay visible.</p></details>`}
function total(){return s.fleet.reduce((n,f)=>n+f.count,0)}
function summary(){return `<h2>Project brief</h2><dl><div><dt>Build</dt><dd data-summary-types>${esc(s.types.join(' + ')||'Not selected')}</dd></div><div><dt>Robots</dt><dd data-summary-total>${total()} total</dd></div><div><dt>Active together</dt><dd data-summary-active>${s.fleet.reduce((n,f)=>n+f.active,0)}</dd></div><div><dt>Operating time</dt><dd data-summary-hours>${qtext('hours','h / sol')}</dd></div><div><dt>Turnaround</dt><dd data-summary-deadline>${qtext('deadline','hours')}</dd></div></dl><p class="help">This brief will inform compute, power, cooling and space requirements.</p>`}
function qtext(key,unit){const v=s.q[key];return v.mode==='unknown'?'Unknown':v.mode==='range'?`${v.min}–${v.max} ${unit}`:`${v.value} ${v.value===1&&unit==='hours'?'hour':unit}`}
function review(){const missing=Object.entries(s.q).filter(([key,v])=>v.mode==='unknown'&&(key!=='road'||s.types.includes('Road'))).map(([k])=>({area:'Survey area',road:'Road length',duration:'Project duration',retention:'Data retention',hours:'Operating schedule',deadline:'Turnaround'})[k]);return `<h2>Review before sizing</h2><p class="help">${esc(s.name)} · ${total()} robots</p><dl class="review-dl"><div><dt>Construction</dt><dd>${esc(s.types.join(', '))}</dd></div><div><dt>Work schedule</dt><dd>${qtext('hours','hours per sol')}</dd></div><div><dt>Results needed</dt><dd>${qtext('deadline','hours')}</dd></div><div><dt>Still to confirm</dt><dd>${esc(missing.join(', ')||'No unanswered quantity fields')}</dd></div></dl><details open><summary>What happens next</summary><p class="help">The sizing model will translate this brief into a facility option and the requirements below.</p><ul class="factor-list">${['Buildable terrain','Ground & ice evidence','Solar conditions','Thermal conditions','Investigation routes'].map(x=>`<li>${x}<span>Awaiting sizing</span></li>`).join('')}</ul></details><p class="help">Interactive intake mock. Facility sizing and feasibility are not connected.</p>`}
function paintSummary(){q('[data-total]')&&(q('[data-total]').textContent=total());for(const [key,v] of Object.entries({total:total()+' total',active:s.fleet.reduce((n,f)=>n+f.active,0),hours:qtext('hours','h / sol'),deadline:qtext('deadline','hours'),types:s.types.join(' + ')||'Not selected'})){const el=q('[data-summary-'+key+']');if(el)el.textContent=v;}}
function validate(){let msg='';const f=q('form');if(f&&!f.reportValidity())return false;if(!s.name.trim())msg='Enter a project name.';else if(!s.types.length)msg='Choose at least one construction type.';else if(!s.fleet.length)msg='Add at least one robot group.';else if(s.fleet.some(f=>!Number.isInteger(f.count)||!Number.isInteger(f.active)||f.count<0||f.active<0||f.active>f.count))msg='Active robots must be whole numbers between zero and the group total.';else if(!Object.values(s.jobs).some(Boolean))msg='Choose at least one required output.';else for(const [key,v] of Object.entries(s.q)){if(v.mode==='range'&&(v.min>v.max||v.min<=0)){msg='Enter a positive range with the minimum no greater than the maximum.';break}if(key==='hours'&&((v.mode==='known'&&v.value>24.65)||(v.mode==='range'&&v.max>24.65))){msg='Operating time cannot exceed one Mars day (about 24.65 hours).';break}}if(q('.alert'))q('.alert').textContent=msg;return !msg;}
function render(){
app.classList.toggle('landing',s.stage==='landing');
app.innerHTML=`<header><div><div class="logo">ARES</div><div class="brand-caption">Mars data center explorer</div></div><div class="context">${s.stage==='landing'?'<strong>Gale crater</strong>Construction planning':'<button type="button" class="quiet home-link" data-home>Back to globe</button><strong>Gale crater</strong>'}</div></header>`;
if(s.stage==='landing'){
app.insertAdjacentHTML('beforeend',`<div class="welcome"><div class="welcome-copy"><h1>Your project.<br>Your next frontier.</h1><p>Describe the construction your robots will do. Explore where its supporting data center could be built.</p><button type="button" class="primary" data-start>${s.started?'Continue project brief':'Define construction project'}</button><small>${s.started?'Your inputs are kept as you explore.':'Start with your project, robots and schedule.'}</small></div><div class="welcome-globe"><canvas aria-label="Mars globe. Drag to rotate or use the direction and zoom buttons."></canvas><div class="orbit-controls"><span>Drag to explore</span><button type="button" data-orbit="left" aria-label="Rotate globe west">←</button><button type="button" data-orbit="right" aria-label="Rotate globe east">→</button><button type="button" data-orbit="up" aria-label="Tilt globe north">↑</button><button type="button" data-orbit="down" aria-label="Tilt globe south">↓</button><button type="button" data-orbit="zoom" aria-label="Zoom globe in">+</button><button type="button" data-orbit="out" aria-label="Zoom globe out">−</button></div></div></div>`);
}else{
app.insertAdjacentHTML('beforeend',`<nav class="journey" aria-label="Planning stages"><span class="current"><b>1</b> Construction brief</span><span><b>2</b> Facility specifications</span><span><b>3</b> Location assessment</span></nav>`);
if(index===0){app.insertAdjacentHTML('beforeend',`<div class="workspace"><form class="form-panel" novalidate><div class="intro-line"><span class="sample-label">Editable example</span><span class="help">${s.step+1} of 4</span></div><h1>Plan the work.<br>Find its foundation.</h1><p class="subhead">Start with the construction your robots will do.</p><nav class="steps" aria-label="Brief sections">${['Project','Robots','Operations','Review'].map((x,i)=>`<button type="button" data-step="${i}" ${s.step===i?'aria-current="step"':''}>${x}</button>`).join('')}</nav><div class="step-content">${s.step===0?project():s.step===1?fleet():s.step===2?`<h2>How will the work run?</h2><div style="margin-top:16px">${schedule()}</div><details open><summary>Required processing outputs</summary>${jobs()}</details>${select('late','If a result is late',['Pause dependent work','Use previous result','Defer nonessential work','Unknown'])}${advanced()}`:review()}</div><p class="alert" role="alert"></p><div class="actions">${s.step?'<button type="button" class="quiet" data-back>Back</button>':'<small>Start with what you know.</small>'}${s.step<3?'<button type="button" class="primary" data-next>Continue</button>':'<button type="button" class="primary" data-edit>Edit brief</button>'}</div></form><aside class="planet-side"><canvas aria-label="Illustrative Mars globe"></canvas><div class="side-title">Built for your mission.</div><p class="help">Construction inputs become the requirements for a place to build.</p><div class="summary" aria-live="polite">${summary()}</div></aside></div>`);
}
}
app.insertAdjacentHTML('beforeend','<div class="credits">Globe imagery: <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a> · CC BY 4.0. Illustration only.</div>');
if(q('form'))q('form').onsubmit=e=>e.preventDefault();
q('[data-start]')?.addEventListener('click',()=>{s.stage='intake';s.started=true;render();persist();q('[data-key="name"]')?.focus({preventScroll:true})});
q('[data-home]')?.addEventListener('click',()=>{s.stage='landing';render();persist();q('[data-start]')?.focus({preventScroll:true})});
const globe=q('canvas');
if(s.stage==='landing'&&globe){let drag=null,frame=0;const redraw=()=>{if(!frame)frame=requestAnimationFrame(()=>{frame=0;draw(globe)})};globe.onpointerdown=e=>{drag=[e.clientX,e.clientY];globe.setPointerCapture(e.pointerId)};globe.onpointermove=e=>{if(!drag)return;s.orbit.lon-=(e.clientX-drag[0])*.008;s.orbit.lat=Math.max(-1.4,Math.min(1.4,s.orbit.lat+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];redraw()};globe.onpointerup=e=>{drag=null;if(globe.hasPointerCapture(e.pointerId))globe.releasePointerCapture(e.pointerId);persist()};globe.onpointercancel=()=>{drag=null};app.querySelectorAll('[data-orbit]').forEach(b=>b.onclick=()=>{const d=b.dataset.orbit;if(d==='left')s.orbit.lon-=.3;if(d==='right')s.orbit.lon+=.3;if(d==='up')s.orbit.lat=Math.min(1.4,s.orbit.lat+.2);if(d==='down')s.orbit.lat=Math.max(-1.4,s.orbit.lat-.2);if(d==='zoom')s.orbit.zoom=Math.min(1.2,s.orbit.zoom+.1);if(d==='out')s.orbit.zoom=Math.max(.7,s.orbit.zoom-.1);redraw();persist()});}
app.querySelectorAll('[data-key]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{s[el.dataset.key]=el.value;persist()}));
app.querySelectorAll('[data-type]').forEach(el=>el.onchange=()=>{s.types=[...app.querySelectorAll('[data-type]:checked')].map(x=>x.dataset.type);render();persist()});
app.querySelectorAll('[data-mode]').forEach(el=>el.onchange=()=>{s.q[el.dataset.mode].mode=el.value;render();persist()});
app.querySelectorAll('[data-q]').forEach(el=>el.oninput=()=>{s.q[el.dataset.q][el.dataset.bound]=el.value===''?0:Number(el.value);paintSummary();persist()});
app.querySelectorAll('[data-robot]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{const row=s.fleet.find(f=>f.id===Number(el.dataset.robot));row[el.dataset.prop]=el.dataset.prop==='role'?el.value:Number(el.value);if(el.dataset.prop==='count'){const a=q(`[data-robot="${row.id}"][data-prop="active"]`);if(a)a.max=row.count;}paintSummary();persist()}));
app.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{s.fleet=s.fleet.filter(f=>f.id!==Number(el.dataset.remove));render();persist()});
q('[data-add]')?.addEventListener('click',()=>{s.fleet.push({id:s.nextId++,role:'Inspection',count:1,active:1});render();persist();q('.robot-row:last-child select')?.focus()});
app.querySelectorAll('[data-job]').forEach(el=>el.onchange=()=>{s.jobs[el.dataset.job]=el.checked;q(`[data-cadence="${el.dataset.job}"]`).disabled=!el.checked;persist()});
app.querySelectorAll('[data-cadence]').forEach(el=>el.onchange=()=>{s.cadence[el.dataset.cadence]=el.value;persist()});
function step(n){s.step=n;render();persist();}
app.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>{if(Number(el.dataset.step)>s.step&&!validate())return;step(Number(el.dataset.step))});
q('[data-next]')?.addEventListener('click',()=>{if(validate())step(s.step+1)});
q('[data-back]')?.addEventListener('click',()=>{if(s.step>0)step(s.step-1);else{q('.subhead').textContent='Your example brief is open. Choose a project type to continue.';}});
q('[data-review]')?.addEventListener('click',()=>{if(validate()){s.review=true;render();persist()}});
q('[data-edit]')?.addEventListener('click',()=>{s.review=false;s.step=0;render();persist()});
requestAnimationFrame(()=>draw(q('canvas')));
}
render();new ResizeObserver(()=>draw(q('canvas'))).observe(app);
controllers.push({render,restore:value=>{s=states[index]={...defaults(),...value};render()}});
if(globalThis.Tweak){const style={accent:'#edc49b',panelPadding:24};const tweak=new Tweak({container:app,onChange:()=>{app.style.setProperty('--sand',style.accent);app.querySelectorAll('.form-panel').forEach(p=>p.style.padding=index===0?style.panelPadding+'px':'0')}});tweak.addColorPicker(style,'accent',{label:'ARES accent'});if(index===0)tweak.addSlider(style,'panelPadding',{label:'Panel spacing',min:16,max:32,unit:'px'});}
});
const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{try{const c=document.createElement('canvas');c.width=1024;c.height=512;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,1024,512);texture=ctx.getImageData(0,0,1024,512).data;root.querySelectorAll('canvas').forEach(draw)}catch(e){}};img.src='https://cdn.jsdelivr.net/gh/Sanghel/solar-system-3d@develop/public/textures/mars.jpg';
window.addEventListener('openai:set_globals',e=>{const st=e.detail?.globals?.widgetState?.privateContent?.guidedFlow;if(Array.isArray(st))st.forEach((v,i)=>{if(v?.q)controllers[i]?.restore(v)})});
})();
</script>
