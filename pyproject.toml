[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "martian-map"
version = "0.1.0"
description = "Starter toolkit for the NASA Space Apps 2026 'Interplanetary Survival Guide: Martian Map' challenge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jianhui-ben" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/jianhui-ben/space-apps-2026-martian-map"
Challenge = "https://www.spaceappschallenge.org/2026/challenges/interplanetary-survival-guide-martian-map/"

[project.scripts]
martian-map = "martian_map.cli:_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "network: hits live public endpoints; skipped unless --run-network is given",
]
